[project]
name = "blindspot"
version = "1.0.0"
description = "BlindSpot: measuring whether language models surface latent, socially marked needs"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [
    { name = "Julius Broomfield", email = "jbroomfield@gatech.edu" },
    { name = "Kartik Sharma", email = "ksartik@gatech.edu" },
]
keywords = ["evaluation", "pluralistic alignment", "standpoint theory", "accessibility"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "litellm>=1.63,<2.0",
    "openai>=1.60,<3.0",
    "anthropic>=0.45,<1.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
    "standpoints>=1.0,<2.0",
    "tokenizers>=0.20,<1.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.1,<4.0",
    "scipy>=1.11,<2.0",
    "statsmodels>=0.14,<1.0",
    "matplotlib>=3.8,<4.0",
    "huggingface-hub>=0.25,<1.0",
]

dataset = [
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "pdfplumber>=0.11,<1.0",
    "python-slugify>=8.0,<9.0",
    "tqdm>=4.66,<5.0",
]

[project.scripts]
blindspot = "blindspot.cli:main"

[project.urls]
Repository = "https://github.com/juliusbroomfield/BlindSpots"

[tool.poetry]
packages = [{ include = "blindspot", from = "src" }]

[tool.poetry.dependencies]
# during development, take standpoints from the checkout rather than pypi
standpoints = { path = "packages/standpoints", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/blindspot/build/*" = ["SIM", "B", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["blindspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/blindspot"]
branch = true
