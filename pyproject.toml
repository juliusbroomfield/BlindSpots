[project]
name = "blindspot"
version = "1.0.0"
description = "BlindSpot: measuring whether language models surface latent, socially marked needs"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [
    { name = "Julius Broomfield", email = "jbroomfield@gatech.edu" },
    { name = "Kartik Sharma", email = "ksartik@gatech.edu" },
]
keywords = ["evaluation", "pluralistic alignment", "standpoint theory", "accessibility"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Enough to generate responses and judge them. One interface to every provider;
# the batch endpoints for OpenAI, Anthropic and Together are wrapped in
# blindspot/llm/batch, since LiteLLM covers only the first of the three.
dependencies = [
    "litellm>=1.63,<2.0",
    "openai>=1.60,<3.0",
    "anthropic>=0.45,<1.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
    # mixture of standpoints, shipped separately so people can use the method
    # without the benchmark. one implementation, not a fork.
    "standpoints>=1.0,<2.0",
    # the embedding model's own tokenizer, so rag chunk sizes are in the units
    # the embedder actually uses. pure rust, no torch, and litellm pulls it
    # anyway — declared because rag.py imports it directly.
    "tokenizers>=0.20,<1.0",
]

# nor is inspect-ai declared as an extra. the adapter in task.py imports it
# lazily and is for people who already run inspect; pinning it here dragged 82
# packages into the lock file — including boto3 — for an optional convenience.
#
# there is deliberately no `together` sdk here. its batch endpoint is three
# rest calls, which llm/batch/together.py makes over httpx; the sdk brought a
# terminal-formatting stack for a cli we never invoke.

[project.optional-dependencies]
# Figures, tables and the reported statistics, plus the Hub client that
# `blindspot fetch` uses to pull the results archive.
analysis = [
    "pandas>=2.1,<4.0",
    "scipy>=1.11,<2.0",
    "statsmodels>=0.14,<1.0",
    "matplotlib>=3.8,<4.0",
    "huggingface-hub>=0.25,<1.0",
]
# Rebuilding the benchmark from the source documents.
dataset = [
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "pdfplumber>=0.11,<1.0",
    "python-slugify>=8.0,<9.0",
    "tqdm>=4.66,<5.0",
]

[project.scripts]
blindspot = "blindspot.cli:main"

[project.urls]
Repository = "https://github.com/juliusbroomfield/BlindSpots"

[tool.poetry]
packages = [{ include = "blindspot", from = "src" }]

[tool.poetry.dependencies]
# during development, take standpoints from the checkout rather than pypi
standpoints = { path = "packages/standpoints", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The construction scripts are kept close to how they actually ran, so the
# benchmark's provenance stays auditable. Style-only rules are off for them.
"src/blindspot/build/*" = ["SIM", "B", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["blindspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/blindspot"]
branch = true
